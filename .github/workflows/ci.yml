name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Bundle JavaScript
        run: npx expo export -p android --output-dir /tmp/export

      - name: Generate the native project
        run: npx expo prebuild -p android

      - name: Unit tests
        run: cd android && ./gradlew :pornfree-vpn:testDebugUnitTest

      - name: Build the APK
        run: cd android && ./gradlew :app:assembleDebug
